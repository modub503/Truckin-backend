# Netlify config for the ApexTMS dispatch app.
#
# This is the app's OWN Netlify project. The marketing site lives in a
# separate project (D:\burnetts-hauling) and talks to this one through the
# backend, not through this file.
#
# Layout of the publish directory (build/):
#   /       -> the React app (single page app)
#   /api/*  -> proxied to the FastAPI backend on Render
#
# TWO WAYS TO DEPLOY
#
#   1. Git-connected: point Netlify at this folder as the base directory.
#      It reads this file, runs the build, publishes build/.
#
#   2. Drag-and-drop: drop the build/ folder into Netlify. The published
#      _headers file inside build/ carries the same rules, so no build step
#      is required.

[build]
	command = "npm run build"
	publish = "build"

[build.environment]
	NODE_VERSION = "22"
	# react-scripts treats warnings as errors in CI. The build is clean, but
	# a warning should never be able to fail someone's deploy.
	CI = "false"
	# The app is served from the root of this project, so its assets live at
	# /static/... and its routes live at /...
	PUBLIC_URL = "/"
	# The fallback API host, for the rare case where the app runs outside a
	# browser and cannot use window.location.origin. In the browser the app
	# calls its own origin and the /api/* proxy below forwards to the
	# backend, so this only matters as a safety net.
	REACT_APP_BACKEND_URL = "https://truckin-backend.onrender.com"

# ---------------------------------------------------------------------------
# ORDER MATTERS.
#
# Netlify walks the rules top to bottom and takes the first match, so the
# catch-all at the bottom must stay last — otherwise it would answer /api/*
# and every blocked path with the app shell.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# API proxy.
#
# The app derives its API base from window.location.origin, so it calls
# /api/* on this domain. Proxying to Render keeps every request
# same-origin: the httpOnly auth cookies keep working and there is no CORS
# negotiation at all.
#
# UPDATE THIS HOST if the Render service hostname changes.
# ---------------------------------------------------------------------------

[[redirects]]
	from = "/api/*"
	to = "https://truckin-backend.onrender.com/api/:splat"
	status = 200
	force = true

# ---------------------------------------------------------------------------
# Nothing outside the app should be reachable. These paths are excluded from
# the publish by .netlifyignore as well — this is the second lock on the door.
# ---------------------------------------------------------------------------

[[redirects]]
	from = "/.env"
	to = "/404.html"
	status = 404

[[redirects]]
	from = "/*/.env"
	to = "/404.html"
	status = 404

[[redirects]]
	from = "/backend/*"
	to = "/404.html"
	status = 404

[[redirects]]
	from = "/memory/*"
	to = "/404.html"
	status = 404

[[redirects]]
	from = "/plan/*"
	to = "/404.html"
	status = 404

[[redirects]]
	from = "/tests/*"
	to = "/404.html"
	status = 404

# ---------------------------------------------------------------------------
# SPA fallback: any path that is not a real file serves the app shell, so
# client-side routes survive a hard refresh or a shared deep link.
# Netlify serves real files first, so /static/... is unaffected.
# ---------------------------------------------------------------------------

[[redirects]]
	from = "/*"
	to = "/index.html"
	status = 200

# ---------------------------------------------------------------------------
# Caching + security headers live in the generated _headers file, not here.
#
# Netlify applies [[headers]] globally — they cannot be scoped to a deploy
# context — so keeping them in netlify.toml would make per-context indexing
# impossible. scripts/generate-headers.mjs writes the _headers file on every
# build and owns every response header, so there is exactly one rule set per
# deploy and nothing can shadow it.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Preview deploys must not be indexed. The rule is written per deploy by
# scripts/generate-headers.mjs; these variables tell it which one to write.
#
# The dispatch app is an employee-only tool behind auth. It is never indexed,
# in any deploy context.
# ---------------------------------------------------------------------------

[context.production.environment]
	ROBOTS_TAG = "noindex, nofollow"

[context.deploy-preview.environment]
	ROBOTS_TAG = "noindex, nofollow"

[context.branch-deploy.environment]
	ROBOTS_TAG = "noindex, nofollow"
